<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Nestlé Milk Formula Recall Search | 雀巢奶粉全球召回查询</title>
    <meta name="description"
        content="Official data-aligned search tool for global Nestlé infant formula recalls. Check your batch codes for safety.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style_v4_1.css">
    <style>
        .disclaimer-banner {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 2px solid #EF4444;
            backdrop-filter: blur(8px);
        }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="text-slate-900 overflow-x-hidden">

    <!-- Disclaimer Modal (Legal Mandatory) -->
    <div id="disclaimerModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay hidden">
        <div class="glass-card bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl space-y-6 slide-up">
            <div
                class="w-16 h-16 tech-dad-gradient rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg">
                🛡️</div>
            <h3 class="text-xl font-black text-center text-slate-900"></h3>
            <div class="space-y-4 text-sm text-slate-600 leading-relaxed">
                <p></p>
                <p></p>
                <p class="font-bold text-slate-900 border-l-4 border-red-500 pl-3"></p>
            </div>
            <button id="acceptBtn"
                class="w-full py-4 tech-dad-gradient text-white rounded-2xl font-bold shadow-xl active:scale-95 transition-all">
            </button>
        </div>
    </div>

    <!-- Global Emergency Banner -->
    <div class="disclaimer-banner sticky top-0 z-50 px-4 py-3 text-center shadow-lg">
        <p class="text-[11px] md:text-xs font-black text-red-600 uppercase tracking-tight" data-i18n="hazard_info">
            ⚠️ CEREULIDE TOXIN IS HEAT-RESISTANT. BOILING WATER HAS NO EFFECT.
        </p>
    </div>

    <!-- Header -->
    <header class="w-full px-4 pt-10 pb-6">
        <div class="max-w-xl mx-auto flex justify-between items-center mb-6">
            <div class="flex items-center space-x-2">
                <div
                    class="w-10 h-10 tech-dad-gradient rounded-xl flex items-center justify-center shadow-lg bottle-icon">
                    <span class="text-white text-xl">🍼</span>
                </div>
                <div>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 leading-none"
                        data-i18n="project_name">Aegis Guard</h2>
                    <h1 class="text-xl font-black tracking-tight mt-1" data-i18n="title">Recall Checker</h1>
                </div>
            </div>

            <button id="langToggle"
                class="px-4 py-2 rounded-xl glass-card border border-slate-200 text-xs font-bold hover:bg-white transition-all shadow-sm active:scale-95">
                EN / 中文
            </button>
        </div>

        <main class="max-w-6xl mx-auto px-4">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

                <!-- Left Column: Search & Results (Primary Focus) -->
                <div class="lg:col-span-7 xl:col-span-8 space-y-8 order-1">
                    <!-- Search Container -->
                    <div class="space-y-2">
                        <div
                            class="glass-card rounded-[1.5rem] p-4 flex items-center focus-within:ring-2 ring-slate-400 transition-all shadow-xl">
                            <div class="pl-3 pr-2 text-slate-300">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                            <input type="text" id="searchInput"
                                class="w-full bg-transparent border-none focus:ring-0 text-lg font-bold placeholder:text-slate-300 placeholder:font-normal py-2"
                                placeholder="Loading..." maxlength="15">
                            <button id="clearBtn" class="p-2 text-slate-300 hover:text-slate-600 hidden">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                        clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Dynamic Results Area -->
                    <div id="resultsContainer" class="min-h-[300px]">
                        <!-- States injected via script.js -->
                    </div>
                </div>

                <!-- Right Column: Official Reference & Sources -->
                <aside class="lg:col-span-5 xl:col-span-4 space-y-6 order-2 lg:sticky lg:top-24">
                    <div class="glass-card rounded-[2rem] p-6 border border-slate-100 shadow-xl bg-white/40">
                        <div class="flex items-center space-x-3 mb-6">
                            <div
                                class="w-8 h-8 tech-dad-gradient rounded-lg flex items-center justify-center text-white text-sm shadow-md">
                                ✓</div>
                            <h4 class="text-xs font-black uppercase tracking-[0.2em] text-slate-800"
                                data-i18n="sources_title">Authoritative Data Sources</h4>
                        </div>

                        <div id="sourcesList" class="space-y-3">
                            <!-- Links injected via script.js -->
                        </div>

                        <div class="mt-8 pt-6 border-t border-slate-200/50">
                            <div class="flex items-start space-x-3 opacity-60">
                                <span class="text-xs">ℹ️</span>
                                <p class="text-[10px] leading-relaxed text-slate-500 font-medium">
                                    This database is synchronized daily with official government records.
                                    Archived snapshots are maintained for transparency and data integrity.
                                </p>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- Footer -->
            <footer class="pt-12 pb-12 text-center">
            </footer>
        </main>
    </header>

    <script src="js/data_v4_1.js"></script>
    <script src="js/script_v4_1.js"></script>
</body>

</html>
