<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Nestlé Milk Formula Recall Search | 雀巢奶粉全球召回查询</title>
    <meta name="description"
        content="Official data-aligned search tool for global Nestlé infant formula recalls. Check your batch codes for safety.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="text-slate-900 overflow-x-hidden">

    <!-- Language Toggle & Header -->
    <header class="w-full px-4 py-6 md:py-8">
        <div class="max-w-xl mx-auto flex justify-between items-center mb-8">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 tech-dad-gradient rounded-xl flex items-center justify-center shadow-lg">
                    <span class="text-white text-xl">🍼</span>
                </div>
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500" data-i18n="project_name">
                        Aegis Guard</h2>
                    <h1 class="text-lg font-bold leading-tight" data-i18n="title">Milk Formula Recall Search</h1>
                </div>
            </div>

            <button id="langToggle"
                class="px-4 py-2 rounded-full glass-card border border-slate-200 text-sm font-semibold hover:bg-white transition-all shadow-sm active:scale-95">
                中文 / EN
            </button>
        </div>

        <!-- Main Search Area -->
        <main class="max-w-xl mx-auto space-y-6">
            <!-- Danger Notice -->
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl shadow-sm mb-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-bold text-red-800" data-i18n="hazard_info">
                            Cereulide toxin is heat-resistant. Boiling water will NOT kill it.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Search Input -->
            <div
                class="glass-card rounded-[2rem] p-4 flex items-center focus-within:ring-2 ring-slate-400 transition-all">
                <div class="pl-4 pr-3 text-slate-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" id="searchInput"
                    class="w-full bg-transparent border-none focus:ring-0 text-xl font-medium placeholder:text-slate-400 py-3"
                    placeholder="Enter 10-digit batch code..." data-i18n-placeholder="input_placeholder" maxlength="15">
                <button id="clearBtn" class="p-2 text-slate-400 hover:text-slate-600 hidden">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <!-- Results Section -->
            <div id="resultsContainer" class="space-y-4 min-h-[200px]">
                <div id="idleState" class="text-center py-12 space-y-4">
                    <div class="text-6xl mx-auto opacity-20">🔍</div>
                    <p class="text-slate-500 font-medium" data-i18n="idle_text">Enter your batch code found on the
                        bottom of the tin.</p>
                </div>
            </div>

            <!-- FAQ/Info Footer -->
            <footer class="pt-8 text-center space-y-4">
                <p class="text-xs text-slate-400" data-i18n="disclaimer">
                    This is an independent tool for public safety. Always refer to official Nestle announcements.
                </p>
                <div class="flex justify-center space-x-4 opacity-50">
                    <span class="text-[10px] font-bold tracking-tighter uppercase px-2 py-1 bg-slate-200 rounded">v1.2.0
                        Stable</span>
                    <span class="text-[10px] font-bold tracking-tighter uppercase px-2 py-1 bg-slate-200 rounded">800+
                        Recorded</span>
                </div>
            </footer>
        </main>
    </header>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
