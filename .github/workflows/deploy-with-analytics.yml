name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Analytics Config from GitHub Secrets
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: |
          # Generate analytics-config.js
          echo "✅ Generating analytics config..."
          cat > js/analytics-config.js << EOF
          // Google Analytics Configuration
          // Auto-generated during deployment - DO NOT EDIT
          const GA_CONFIG = {
              measurementId: '${GA4_MEASUREMENT_ID:-G-XXXXXXXXXX}',
              anonymizeIp: true,
              cookieFlags: 'SameSite=None;Secure',
              enabled: true
          };
          
          const isProduction = window.location.hostname.includes('github.io');
          
          if (GA_CONFIG.enabled && isProduction && GA_CONFIG.measurementId !== 'G-XXXXXXXXXX') {
              const script = document.createElement('script');
              script.async = true;
              script.src = \`https://www.googletagmanager.com/gtag/js?id=\${GA_CONFIG.measurementId}\`;
              document.head.appendChild(script);
          
              window.dataLayer = window.dataLayer || [];
              function gtag() { dataLayer.push(arguments); }
              gtag('js', new Date());
              gtag('config', GA_CONFIG.measurementId, {
                  'anonymize_ip': GA_CONFIG.anonymizeIp,
                  'cookie_flags': GA_CONFIG.cookieFlags
              });
              console.log('Google Analytics loaded');
          } else {
              console.log('Google Analytics disabled');
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
